<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ML Prediction App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .model-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s ease;
            resize: vertical;
            min-height: 80px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .help-text {
            display: block;
            margin-top: 5px;
            color: #6c757d;
            font-size: 14px;
            font-style: italic;
        }
        
        .btn-predict {
            width: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-predict:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-generate {
            margin-top: 10px;
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        
        .btn-generate:hover {
            background: #5a6268;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #28a745;
            display: none;
        }
        
        .result.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        
        .emoji {
            font-size: 1.5em;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
        }
        
        .prediction-confidence {
            margin: 10px 0;
        }
        
        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ML Prediction App</h1>
        <p class="subtitle">Binary Classification with 10 Features</p>
        
        <div class="model-info">
            <h3>📊 Model: {{ model_info.model_name }}</h3>
            <p>🎯 Accuracy: {{ (model_info.accuracy * 100)|round(1) }}%</p>
            <p>🔢 Features: {{ model_info.features }}</p>
        </div>
        
        <form id="predictionForm">
            <div class="form-group">
                <label for="features">💡 Enter Features (comma-separated):</label>
                <textarea id="features" name="features" 
                         placeholder="Enter 10 features separated by commas, e.g., 0.5, 1.2, -0.3, 0.8, 1.5, -0.2, 0.7, 1.1, -0.5, 0.9"
                         rows="3" required>0.5, 1.2, -0.3, 0.8, 1.5, -0.2, 0.7, 1.1, -0.5, 0.9</textarea>
                <small class="help-text">💡 Please enter exactly 10 numerical values separated by commas</small>
                <button type="button" class="btn-generate" id="generateBtn">
                    🎲 Generate Random Sample
                </button>
            </div>
            
            <button type="submit" class="btn-predict" id="predictBtn">
                🔮 Predict Class
            </button>
        </form>
        
        <div id="result" class="result">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('predictBtn');
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            const featuresInput = document.getElementById('features').value.trim();
            
            // Disable button and show loading
            btn.disabled = true;
            btn.textContent = '⏳ Predicting...';
            result.style.display = 'block';
            result.className = 'result';
            resultContent.innerHTML = '<div class="loading">🔄 Processing...</div>';
            
            // Parse input
            const featuresArray = featuresInput.split(',').map(f => f.trim());
            
            // Validate input
            if (featuresArray.length !== 10) {
                result.style.display = 'block';
                result.className = 'result error';
                resultContent.innerHTML = `
                    <h3><span class="emoji">❌</span> Input Error</h3>
                    <p>Please enter exactly 10 features. You entered ${featuresArray.length} features.</p>
                `;
                btn.disabled = false;
                btn.textContent = '🔮 Predict Class';
                return;
            }
            
            // Convert to numbers and validate
            const features = [];
            for (let i = 0; i < featuresArray.length; i++) {
                const num = parseFloat(featuresArray[i]);
                if (isNaN(num)) {
                    result.style.display = 'block';
                    result.className = 'result error';
                    resultContent.innerHTML = `
                        <h3><span class="emoji">❌</span> Input Error</h3>
                        <p>Feature ${i + 1} is not a valid number: "${featuresArray[i]}"</p>
                    `;
                    btn.disabled = false;
                    btn.textContent = '🔮 Predict Class';
                    return;
                }
                features.push(num);
            }
            
            // Prepare data for API
            const formData = {
                feature_0: features[0],
                feature_1: features[1],
                feature_2: features[2],
                feature_3: features[3],
                feature_4: features[4],
                feature_5: features[5],
                feature_6: features[6],
                feature_7: features[7],
                feature_8: features[8],
                feature_9: features[9]
            };
            
            // Make API call
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const confidence = Math.round(data.confidence * 100);
                    resultContent.innerHTML = `
                        <h3><span class="emoji">🎯</span> Prediction Result</h3>
                        <div class="prediction-confidence">
                            <strong>Class: ${data.prediction}</strong>
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confidence}%"></div>
                            </div>
                            <span>${confidence}%</span>
                        </div>
                        <div style="margin-top: 15px;">
                            <strong>Binary Classification:</strong><br>
                            📊 Class 0: ${Math.round(data.probabilities.class_0 * 100)}%<br>
                            📈 Class 1: ${Math.round(data.probabilities.class_1 * 100)}%
                        </div>
                    `;
                } else {
                    result.className = 'result error';
                    resultContent.innerHTML = `
                        <h3><span class="emoji">❌</span> Error</h3>
                        <p>${data.error}</p>
                    `;
                }
            })
            .catch(error => {
                result.className = 'result error';
                resultContent.innerHTML = `
                    <h3><span class="emoji">🚫</span> Network Error</h3>
                    <p>Could not connect to the prediction service.</p>
                    <p><small>Error: ${error.message}</small></p>
                `;
            })
            .finally(() => {
                // Re-enable button
                btn.disabled = false;
                btn.textContent = '🔮 Predict Class';
            });
        });
        
        // Generate random sample button with extreme patterns for high confidence
        document.getElementById('generateBtn').addEventListener('click', function() {
            const randomFeatures = [];
            
            // Generate very clear patterns for high confidence
            const isClass0Pattern = Math.random() < 0.5; // Randomly choose class pattern
            
            for (let i = 0; i < 10; i++) {
                let value;
                if (isClass0Pattern) {
                    // Extreme Class 0 pattern: mostly strong positive values
                    value = Math.random() < 0.9 ? 
                        (Math.random() * 2 + 1.0) :    // 90% strong positive values (1.0 to 3.0)
                        (Math.random() * 0.5);         // 10% small positive values (0 to 0.5)
                } else {
                    // Extreme Class 1 pattern: mostly strong negative values
                    value = Math.random() < 0.9 ? 
                        (Math.random() * -2 - 1.0) :   // 90% strong negative values (-3.0 to -1.0)
                        (Math.random() * -0.5);        // 10% small negative values (-0.5 to 0)
                }
                randomFeatures.push(value.toFixed(1));
            }
            document.getElementById('features').value = randomFeatures.join(', ');
        });
    </script>
</body>
</html>
