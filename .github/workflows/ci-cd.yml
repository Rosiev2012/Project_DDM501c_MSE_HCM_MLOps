name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE_NAME: ml-model-api

jobs:
  # ====================================
  # JOB 1: LINT AND CODE QUALITY
  # ====================================
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        echo "🔍 Running code linting..."
        flake8 --max-line-length=88 --ignore=E203,W503 *.py || true
    
    - name: Check code formatting
      run: |
        echo "🎨 Checking code formatting..."
        black --check *.py || true

  # ====================================
  # JOB 2: ML PIPELINE TESTING
  # ====================================
  test-ml-pipeline:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run ML pipeline
      run: |
        echo "🤖 Running ML pipeline..."
        python ml_pipeline.py
    
    - name: Upload trained models
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: models/
        retention-days: 7

  # ====================================
  # JOB 3: MODEL VALIDATION
  # ====================================
  validate-model:
    runs-on: ubuntu-latest
    needs: test-ml-pipeline
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download trained models
      uses: actions/download-artifact@v4
      with:
        name: trained-models
        path: models/
    
    - name: Validate model performance
      run: |
        echo "🎯 Validating model performance..."
        python -c "
        import joblib, json
        try:
            model = joblib.load('models/best_model.pkl')
            with open('models/model_info.json') as f:
                info = json.load(f)
            accuracy = info['accuracy']
            print(f'Model accuracy: {accuracy}')
            if accuracy < 0.8:
                print('❌ Model accuracy too low!')
                exit(1)
            else:
                print('✅ Model meets quality standards')
        except Exception as e:
            print(f'Validation error: {e}')
            exit(1)
        "

  # ====================================
  # JOB 4: BUILD & DEPLOY DOCKER IMAGE
  # ====================================
  build-docker:
    runs-on: ubuntu-latest
    needs: [validate-model]
    steps:
    - uses: actions/checkout@v4
    
    - name: Check required files
      run: |
        echo "🔍 Checking required files for Docker build..."
        ls -la
        echo ""
        echo "📄 Dockerfile:"
        head -10 Dockerfile
        echo ""
        echo "📦 Requirements.txt:"
        cat requirements.txt
        echo ""
        echo "✅ Files check completed"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64
    
    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/master' && vars.DOCKERHUB_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.DOCKER_IMAGE_NAME }}
          ${{ vars.DOCKERHUB_USERNAME && format('{0}/{1}', vars.DOCKERHUB_USERNAME, env.DOCKER_IMAGE_NAME) || '' }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        flavor: |
          latest=auto
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ github.ref == 'refs/heads/master' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: ${{ github.ref == 'refs/heads/master' && vars.DOCKERHUB_USERNAME != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: ${{ github.ref != 'refs/heads/master' && 'type=docker,dest=/tmp/ml-model-api.tar' || '' }}
    
    - name: Test Docker image locally
      if: github.ref != 'refs/heads/master'
      run: |
        echo "🐳 Loading and testing Docker image locally..."
        docker load --input /tmp/ml-model-api.tar
        docker images
        echo "🧪 Testing image can start..."
        docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest python --version
        echo "✅ Docker image test completed!"
    
    - name: Verify DockerHub push
      if: github.ref == 'refs/heads/master' && vars.DOCKERHUB_USERNAME != ''
      run: |
        echo "✅ Docker image pushed to DockerHub successfully!"
        echo "📦 Image: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
        echo "🌐 DockerHub URL: https://hub.docker.com/r/${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}"

  # ====================================
  # JOB 5: DEPLOY (MANUAL TRIGGER)
  # ====================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/master'
    environment: production
    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        echo "Docker image: ${{ vars.DOCKERHUB_USERNAME && format('{0}/{1}:latest', vars.DOCKERHUB_USERNAME, env.DOCKER_IMAGE_NAME) || format('{0}:latest', env.DOCKER_IMAGE_NAME) }}"
        echo "✅ Deployment completed!"
        # Add actual deployment commands here
