name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE_NAME: ml-model-api

jobs:
  # ====================================
  # JOB 1: LINT AND CODE QUALITY
  # ====================================
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        echo "🔍 Running code linting..."
        flake8 --max-line-length=88 --ignore=E203,W503 *.py || true
    
    - name: Check code formatting
      run: |
        echo "🎨 Checking code formatting..."
        black --check *.py || true

  # ====================================
  # JOB 2: TEST ML PIPELINE
  # ====================================
  test-ml-pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run ML Pipeline
      run: |
        echo "🧪 Testing ML Pipeline..."
        python ml_pipeline.py
        ls -la models/
    
    - name: Upload models as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: models/
        retention-days: 1

  # ====================================
  # JOB 3: TEST API
  # ====================================
  test-api:
    runs-on: ubuntu-latest
    needs: test-ml-pipeline
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download trained models
      uses: actions/download-artifact@v4
      with:
        name: trained-models
        path: models/
    
    - name: Test API
      run: |
        echo "🧪 Testing API..."
        python api_service.py &
        sleep 10
        python test_api.py || true
        pkill -f api_service.py

  # ====================================
  # JOB 4: SECURITY SCAN
  # ====================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        pip install safety bandit
    
    - name: Run security scan
      run: |
        echo "🔒 Running security scan..."
        safety check --json || true
        bandit -r . -f json || true

  # ====================================
  # JOB 5: BUILD DOCKER IMAGE
  # ====================================
  build-docker:
    runs-on: ubuntu-latest
    needs: [test-ml-pipeline, test-api]
    if: github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ====================================
  # JOB 6: PERFORMANCE TEST
  # ====================================
  performance-test:
    runs-on: ubuntu-latest
    needs: test-ml-pipeline
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download trained models
      uses: actions/download-artifact@v4
      with:
        name: trained-models
        path: models/
    
    - name: Run performance tests
      run: |
        echo "⚡ Running performance tests..."
        python api_service.py &
        sleep 10
        python -c "
        import test_api
        try:
            test_api.performance_test()
            test_api.load_test()
        except Exception as e:
            print(f'Performance test completed with: {e}')
        "
        pkill -f api_service.py

  # ====================================
  # JOB 7: MODEL VALIDATION
  # ====================================
  validate-model:
    runs-on: ubuntu-latest
    needs: test-ml-pipeline
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download trained models
      uses: actions/download-artifact@v4
      with:
        name: trained-models
        path: models/
    
    - name: Validate model performance
      run: |
        echo "🎯 Validating model performance..."
        python -c "
        import joblib, json
        try:
            model = joblib.load('models/best_model.pkl')
            with open('models/model_info.json') as f:
                info = json.load(f)
            accuracy = info['accuracy']
            print(f'Model accuracy: {accuracy}')
            if accuracy < 0.8:
                print('❌ Model accuracy too low!')
                exit(1)
            else:
                print('✅ Model meets quality standards')
        except Exception as e:
            print(f'Validation error: {e}')
            exit(1)
        "

  # ====================================
  # JOB 8: DEPLOY (MANUAL TRIGGER)
  # ====================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-docker, validate-model]
    if: github.ref == 'refs/heads/master'
    environment: production
    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        echo "Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
        echo "✅ Deployment completed!"
        # Add actual deployment commands here
